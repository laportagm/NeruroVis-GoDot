# NeuroVis Memory Presets
# Pre-configured memory profiles for different educational scenarios

[preset_student_laptop]
# Optimized for typical student laptops (8GB RAM)
description = "Memory-efficient settings for student devices"
target_memory_mb = 350
texture_quality = 0.75
model_cache_limit = 20
enable_aggressive_gc = true
shadow_quality = "medium"
msaa_level = 2

[preset_classroom_presentation]
# Balanced for classroom projection systems
description = "Balanced quality and performance for presentations"
target_memory_mb = 400
texture_quality = 0.85
model_cache_limit = 25
enable_aggressive_gc = false
shadow_quality = "high"
msaa_level = 4

[preset_clinical_workstation]
# High quality for medical workstations (16GB+ RAM)
description = "Maximum quality for clinical environments"
target_memory_mb = 600
texture_quality = 1.0
model_cache_limit = 50
enable_aggressive_gc = false
shadow_quality = "ultra"
msaa_level = 8

[preset_mobile_device]
# Ultra-optimized for tablets and low-end devices
description = "Minimal memory usage for mobile learning"
target_memory_mb = 250
texture_quality = 0.5
model_cache_limit = 10
enable_aggressive_gc = true
shadow_quality = "low"
msaa_level = 0

[preset_vr_headset]
# Optimized for VR educational experiences
description = "VR-optimized memory management"
target_memory_mb = 450
texture_quality = 0.9
model_cache_limit = 30
enable_aggressive_gc = false
shadow_quality = "medium"
msaa_level = 2