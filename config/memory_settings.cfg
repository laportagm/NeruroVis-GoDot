# NeuroVis Memory Configuration
# Educational platform memory optimization settings

[memory_limits]
# Target memory usage in MB (<500MB total for educational requirements)
target_memory_mb = 400
critical_memory_mb = 450
texture_budget_mb = 200
model_budget_mb = 150
cache_budget_mb = 50

[optimization_thresholds]
# Memory usage percentages that trigger optimization levels
mild_threshold = 0.70      # 70% of target
moderate_threshold = 0.85  # 85% of target
aggressive_threshold = 0.95 # 95% of target

[educational_priorities]
# High priority resources that should remain cached
priority_models = ["Internal_Structures.glb", "Half_Brain.glb", "Brainstem(Solid).glb"]
priority_data = ["anatomical_data.json", "anatomical_data_v2.json"]
priority_shaders = ["brain_tissue.gdshader", "selection_highlight.gdshader"]

[texture_settings]
# Texture memory optimization
max_texture_size = 2048
enable_compression = true
mipmap_levels = 4
compression_quality = 0.85

[model_settings]
# 3D model memory optimization
max_model_cache = 25
enable_lod = true
lod_distances = [0, 50, 100, 200]
simplification_ratios = [1.0, 0.7, 0.4, 0.2]

[cache_settings]
# Resource cache configuration
max_cache_entries = 100
cache_timeout_seconds = 300
enable_lru_eviction = true
keep_educational_content = true

[garbage_collection]
# Memory cleanup settings
gc_interval_seconds = 30
aggressive_gc_threshold_mb = 400
force_gc_on_scene_change = true

[debug_settings]
# Memory debugging options
show_memory_overlay = false
log_memory_events = true
track_allocation_sources = false